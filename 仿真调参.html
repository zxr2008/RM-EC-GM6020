<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM6020 正弦跟随 · 控制算法仿真器</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f7f7f8; --line:#e3e3e6; --tx:#1a1a1a; --tx2:#6b6b73;
    --ref:#d93a3a; --fdb:#2f6fd0; --volt:#1f9e6a; --warn:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1c1f; --bg2:#26262b; --line:#3a3a41; --tx:#eaeaea; --tx2:#9a9aa2;
           --ref:#ef6b6b; --fdb:#6ba4f0; --volt:#4cc794; --warn:#f08c4c; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 22px 32px;background:var(--bg);color:var(--tx);
       font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:14px;line-height:1.6}
  h1{font-size:19px;font-weight:500;margin:0 0 4px}
  .sub{color:var(--tx2);font-size:13px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:minmax(260px,300px) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} }
  .panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:12px 0 4px}
  .row:first-child{margin-top:0}
  .val{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:12px}
  input[type=range]{width:100%;accent-color:var(--fdb);margin:0}
  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{flex:1;padding:7px 4px;font-size:13px;font-family:inherit;cursor:pointer;
    background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px}
  .seg button.on{background:var(--fdb);color:#fff;border-color:var(--fdb)}
  .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .acts button{padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer;
    background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px}
  .acts button.primary{border-color:var(--warn);color:var(--warn)}
  canvas{width:100%;height:400px;display:block}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:12px}
  .m{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .m b{display:block;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
  .m span{font-size:12px;color:var(--tx2)}
  .hint{font-size:12px;color:var(--tx2);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  code{font-family:Consolas,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<h1>GM6020 正弦跟随 · 控制算法仿真器</h1>
<p class="sub">和 <code>ControlTask.cpp</code> 里的双环逻辑完全一致（1 kHz、位置式 PID、积分回退、输出限幅、掉线保护）。改参数看曲线，把好参数抄回代码。</p>

<div class="grid">
  <div class="panel">
    <div class="seg">
      <button id="m0" class="on">速度跟随</button>
      <button id="m1">位置跟随</button>
    </div>

    <div class="row"><label>正弦频率</label><span class="val"><span id="vf">0.20</span> Hz</span></div>
    <input type="range" id="freq" min="0.05" max="0.6" step="0.05" value="0.2">

    <div class="row" id="rowApos"><label>位置幅值</label><span class="val"><span id="vap">0.60</span> rad</span></div>
    <input type="range" id="apos" min="0.1" max="1.5" step="0.1" value="0.6">

    <div class="row" id="rowAvel"><label>速度幅值</label><span class="val"><span id="vav">1.50</span> rad/s</span></div>
    <input type="range" id="avel" min="0.3" max="3.0" step="0.1" value="1.5">

    <div class="row"><label>位置环 Kp</label><span class="val" id="vkp">5</span></div>
    <input type="range" id="kpp" min="0.5" max="15" step="0.5" value="5">

    <div class="row"><label>速度环 Kp</label><span class="val" id="vkv">1200</span></div>
    <input type="range" id="kpv" min="200" max="5000" step="100" value="1200">

    <div class="row"><label>速度环 Ki</label><span class="val" id="vkiv">6000</span></div>
    <input type="range" id="kiv" min="0" max="15000" step="500" value="6000">

    <div class="row"><label>电压限幅</label><span class="val"><span id="vvm">4000</span> /25000</span></div>
    <input type="range" id="vm" min="500" max="8000" step="250" value="4000">

    <div class="acts">
      <button id="reset">套用代码默认值</button>
      <button id="drop" class="primary">模拟 CAN 掉线 120 ms</button>
    </div>
    <div class="hint">模型里带了两个真实世界的"坏东西"：转速反馈按 1 rpm 量化、反馈延迟 1 ms。所以你看到的小抖动是真实的，增益加太大抖动会变成嗡嗡响。掉线按钮会演示"100 ms 没有反馈 → 锁死输出"的保护逻辑。</div>
  </div>

  <div class="panel">
    <canvas id="cv"></canvas>
    <div class="metrics" id="ms"></div>
  </div>
</div>

<script>
const T = 0.001, PI = Math.PI;
const KV = 33.5 / 24;
const TAU = 0.04;
const VOLT_FS = 25000;
const RPM2RAD = 2 * PI / 60;
const ANGQ = 2 * PI / 8192;

const S = {
  mode: 0, freq: 0.2, apos: 0.6, avel: 1.5,
  kpPos: 5, kiPos: 0, kpVel: 1200, kiVel: 6000,
  voltMax: 4000, ff: 1.0, velRefMax: 3.0,
  dropAt: -1, dropDur: 0.12
};

class Pid {
  constructor(kp, ki, kd, omax, omin) {
    this.kp = kp; this.ki = ki; this.kd = kd;
    this.omax = omax; this.omin = omin;
    this.integ = 0; this.last = 0;
  }
  reset() { this.integ = 0; this.last = 0; }
  calc(ref, fdb) {
    const err = ref - fdb;
    const deriv = err - this.last;
    this.integ += err;
    let out = this.kp * err + this.ki * this.integ * T + this.kd * deriv / T;
    if (out > this.omax) { out = this.omax; this.integ -= err; }
    else if (out < this.omin) { out = this.omin; this.integ -= err; }
    this.last = err;
    return out;
  }
}

function wrapPi(a) {
  while (a > PI) a -= 2 * PI;
  while (a < -PI) a += 2 * PI;
  return a;
}

function simulate() {
  const dur = Math.max(3 / S.freq, 8);
  const N = Math.round(dur / T);
  const posPid = new Pid(S.kpPos, S.kiPos, 0, S.velRefMax, -S.velRefMax);
  const velPid = new Pid(S.kpVel, S.kiVel, 0, S.voltMax, -S.voltMax);
  const w = 2 * PI * S.freq;

  let theta = 0, omega = 0, t = 0;
  let fault = false, lost = 0, dropActive = false;
  let faultTime = -1;
  const bufOm = [], bufTh = [];

  const tArr = [], refArr = [], fdbArr = [], voltArr = [], errArr = [];
  let vPeak = 0, wPeak = 0;

  for (let i = 0; i < N; i++) {
    t += T;

    const posRef = S.apos * Math.sin(w * t);
    const posVelFF = S.apos * w * Math.cos(w * t);
    const velRefQ = (S.mode === 0) ? S.avel * Math.cos(w * t) : posVelFF;

    bufOm.push(omega); bufTh.push(theta);
    const k = Math.max(0, bufOm.length - 2);
    const velFdb = Math.round(bufOm[k] / RPM2RAD) * RPM2RAD;
    const posFdb = wrapPi(Math.round(bufTh[k] / ANGQ) * ANGQ);

    let velCmd;
    if (S.mode === 0) {
      velCmd = velRefQ;
    } else {
      velCmd = posPid.calc(posRef, posFdb) + S.ff * posVelFF;
      if (velCmd > S.velRefMax) velCmd = S.velRefMax;
      if (velCmd < -S.velRefMax) velCmd = -S.velRefMax;
    }

    let volt = velPid.calc(velCmd, velFdb);

    if (S.dropAt > 0 && t >= S.dropAt) {
      if (t < S.dropAt + S.dropDur) { dropActive = true; }
      else if (dropActive) { dropActive = false; lost = 0; }
    }
    if (dropActive) { lost += 1; } else { lost = 0; }

    if (Math.abs(velFdb) > 35 || lost > 100) fault = true;
    if (fault) {
      if (faultTime < 0) faultTime = t;
      volt = 0;
      velPid.reset();
      posPid.reset();
    }

    const V = volt * 24 / VOLT_FS;
    omega += ((KV * V) - omega) / TAU * T;
    theta += omega * T;

    const refShow = (S.mode === 0) ? velRefQ : posRef;
    const fdbShow = (S.mode === 0) ? velFdb : posFdb;
    const errShow = refShow - fdbShow;

    if (Math.abs(volt) > vPeak) vPeak = Math.abs(volt);
    if (Math.abs(omega) > wPeak) wPeak = Math.abs(omega);

    if (i % 10 === 0) {
      tArr.push(t); refArr.push(refShow); fdbArr.push(fdbShow);
      voltArr.push(volt); errArr.push(errShow);
    }
  }

  const n = tArr.length, start = Math.floor(n * 0.5);
  let maxErr = 0, sumSq = 0, cnt = 0;
  for (let i = start; i < n; i++) {
    const e = Math.abs(errArr[i]);
    if (e > maxErr) maxErr = e;
    sumSq += errArr[i] * errArr[i];
    cnt++;
  }
  const rms = Math.sqrt(sumSq / Math.max(cnt, 1));

  return { tArr, refArr, fdbArr, voltArr, maxErr, rms, vPeak, wPeak, fault, faultTime };
}

const cv = document.getElementById('cv');
const msBox = document.getElementById('ms');

function draw(R) {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cs = getComputedStyle(document.documentElement);
  const cTx = cs.getPropertyValue('--tx').trim();
  const cTx2 = cs.getPropertyValue('--tx2').trim();
  const cLine = cs.getPropertyValue('--line').trim();
  const cRef = cs.getPropertyValue('--ref').trim();
  const cFdb = cs.getPropertyValue('--fdb').trim();
  const cVolt = cs.getPropertyValue('--volt').trim();
  const cWarn = cs.getPropertyValue('--warn').trim();

  const W = r.width, H = r.height;
  g.clearRect(0, 0, W, H);

  const L = 46, Rp = 12, gap = 26;
  const h1 = (H - gap - 26) * 0.62;
  const h2 = H - h1 - gap - 26;

  const p1 = { x: L, y: 22, w: W - L - Rp, h: h1 };
  const p2 = { x: L, y: 22 + h1 + gap, w: W - L - Rp, h: h2 };

  const n = R.tArr.length;
  const t0 = 0, t1 = R.tArr[n - 1];

  function axis(p, lo, hi, fmt, unit) {
    if (hi - lo < 1e-6) { hi = lo + 1; }
    g.strokeStyle = cLine; g.lineWidth = 1;
    g.beginPath(); g.moveTo(p.x, p.y + p.h); g.lineTo(p.x + p.w, p.y + p.h); g.stroke();
    g.fillStyle = cTx2; g.font = '11px system-ui,sans-serif'; g.textAlign = 'right';
    for (let k = 0; k <= 4; k++) {
      const v = lo + (hi - lo) * k / 4;
      const y = p.y + p.h - p.h * k / 4;
      g.strokeStyle = cLine;
      g.beginPath(); g.moveTo(p.x, y); g.lineTo(p.x + p.w, y); g.stroke();
      g.fillText(fmt(v), p.x - 6, y + 4);
    }
    g.textAlign = 'left';
    if (unit) g.fillText(unit, p.x + 2, p.y - 6);
  }

  const zoom = 1.0;
  const vals = [];
  for (let i = 0; i < n; i++) { vals.push(R.refArr[i], R.fdbArr[i]); }
  let mx = 0;
  for (const v of vals) mx = Math.max(mx, Math.abs(v));
  mx = mx * 1.15 + 1e-6;
  if (R.fault) mx = Math.max(mx, 0.5);

  axis(p1, -mx, mx, (v) => v.toFixed(2), (S.mode === 0 ? '角速度 rad/s' : '角度 rad'));

  g.strokeStyle = cLine; g.lineWidth = 0.5;
  g.beginPath(); g.moveTo(p1.x, p1.y + p1.h / 2); g.lineTo(p1.x + p1.w, p1.y + p1.h / 2); g.stroke();

  function plot(p, arr, color, lo, hi) {
    g.strokeStyle = color; g.lineWidth = 1.5; g.beginPath();
    for (let i = 0; i < n; i++) {
      const x = p.x + p.w * (R.tArr[i] - t0) / (t1 - t0);
      const y = p.y + p.h - p.h * (arr[i] - lo) / (hi - lo);
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }

  plot(p1, R.refArr, cRef, -mx, mx);
  plot(p1, R.fdbArr, cFdb, -mx, mx);

  if (R.faultTime > 0) {
    const x = p1.x + p1.w * (R.faultTime - t0) / (t1 - t0);
    g.fillStyle = cWarn; g.globalAlpha = 0.12;
    g.fillRect(x, p1.y, p1.x + p1.w - x, p1.h + gap + h2);
    g.globalAlpha = 1;
    g.fillStyle = cWarn; g.font = '11px system-ui,sans-serif'; g.textAlign = 'left';
    g.fillText('保护触发，输出锁死', x + 4, p1.y + 12);
  }

  let vmx = 1;
  for (const v of R.voltArr) vmx = Math.max(vmx, Math.abs(v));
  vmx *= 1.15;
  axis(p2, -vmx, vmx, (v) => Math.round(v).toString(), '电压指令（满量程 25000）');
  plot(p2, R.voltArr, cVolt, -vmx, vmx);

  g.fillStyle = cTx2; g.font = '11px system-ui,sans-serif'; g.textAlign = 'left';
  g.fillText('0 s', p2.x, p2.y + p2.h + 16);
  g.textAlign = 'right';
  g.fillText(t1.toFixed(1) + ' s', p2.x + p2.w, p2.y + p2.h + 16);

  g.textAlign = 'left';
  g.fillStyle = cRef; g.fillRect(p1.x + 4, p1.y + 2, 14, 2);
  g.fillStyle = cTx; g.fillText('给定', p1.x + 22, p1.y + 6);
  g.fillStyle = cFdb; g.fillRect(p1.x + 62, p1.y + 2, 14, 2);
  g.fillStyle = cTx; g.fillText('反馈', p1.x + 80, p1.y + 6);
  g.fillStyle = cVolt; g.fillRect(p1.x + 120, p1.y + 2, 14, 2);
  g.fillStyle = cTx; g.fillText('电压', p1.x + 138, p1.y + 6);

  const unit1 = S.mode === 0 ? 'rad/s' : 'rad';
  const items = [
    ['最大误差', R.maxErr.toFixed(3) + ' ' + unit1],
    ['RMS 误差', R.rms.toFixed(3) + ' ' + unit1],
    ['峰值电压', Math.round(R.vPeak).toString()],
    ['峰值转速', (R.wPeak * 60 / (2 * PI)).toFixed(0) + ' rpm'],
    ['状态', R.fault ? '保护锁死' : '正常运行']
  ];
  msBox.innerHTML = items.map(([k, v]) =>
    '<div class="m"><b>' + v + '</b><span>' + k + '</span></div>').join('');
}

function run() {
  const R = simulate();
  draw(R);
}

function bind(id, key, labelId, fmt) {
  const el = document.getElementById(id);
  const show = document.getElementById(labelId);
  if (!el) return;
  el.addEventListener('input', () => {
    S[key] = parseFloat(el.value);
    if (show) show.textContent = fmt(S[key]);
    run();
  });
}

bind('freq', 'freq', 'vf', (v) => v.toFixed(2));
bind('apos', 'apos', 'vap', (v) => v.toFixed(2));
bind('avel', 'avel', 'vav', (v) => v.toFixed(2));
bind('kpp', 'kpPos', 'vkp', (v) => v.toFixed(0));
bind('kpv', 'kpVel', 'vkv', (v) => v.toFixed(0));
bind('kiv', 'kiVel', 'vkiv', (v) => v.toFixed(0));
bind('vm', 'voltMax', 'vvm', (v) => v.toFixed(0));

const b0 = document.getElementById('m0');
const b1 = document.getElementById('m1');
function setMode(m) {
  S.mode = m;
  b0.classList.toggle('on', m === 0);
  b1.classList.toggle('on', m === 1);
  document.getElementById('rowApos').style.display = m === 1 ? 'flex' : 'none';
  document.getElementById('apos').style.display = m === 1 ? 'block' : 'none';
  document.getElementById('rowAvel').style.display = m === 0 ? 'flex' : 'none';
  document.getElementById('avel').style.display = m === 0 ? 'block' : 'none';
  S.dropAt = -1;
  run();
}
b0.addEventListener('click', () => setMode(0));
b1.addEventListener('click', () => setMode(1));

document.getElementById('drop').addEventListener('click', () => {
  S.dropAt = Math.max(3 / S.freq, 8) * 0.35;
  run();
});

document.getElementById('reset').addEventListener('click', () => {
  S.dropAt = -1;
  const d = { freq: 0.2, apos: 0.6, avel: 1.5, kpp: 5, kpv: 1200, kiv: 6000, vm: 4000 };
  for (const k in d) {
    const el = document.getElementById(k);
    el.value = d[k];
    el.dispatchEvent(new Event('input'));
  }
});

setMode(0);
window.addEventListener('resize', () => run());
</script>
</body>
</html>
